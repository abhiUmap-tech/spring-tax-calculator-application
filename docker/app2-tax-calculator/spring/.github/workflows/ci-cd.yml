name: CI/CD to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: k8s-cluster
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  SERVICE_A_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tax-service-a
  SERVICE_B_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tax-service-b
  APP_ROOT: docker/app2-tax-calculator/spring

jobs:
  build-and-deploy:
    name: Build, Push & Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. Checkout source ----------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------- 2. Set up JDK 21 ----------
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ---------- 3. Build service-a ----------
      - name: Build service-a with Maven
        working-directory: ${{ env.APP_ROOT }}/service-a
        run: mvn -B clean package -DskipTests

      # ---------- 4. Build service-b ----------
      - name: Build service-b with Maven
        working-directory: ${{ env.APP_ROOT }}/service-b
        run: mvn -B clean package -DskipTests

      # ---------- 5. Login to Docker Hub ----------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- 6. Compute image tag ----------
      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ---------- 7. Build & push service-a image ----------
      - name: Build and push service-a image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ env.APP_ROOT }}/service-a
          push: true
          tags: |
            ${{ env.SERVICE_A_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.SERVICE_A_IMAGE }}:latest

      # ---------- 8. Build & push service-b image ----------
      - name: Build and push service-b image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ env.APP_ROOT }}/service-b
          push: true
          tags: |
            ${{ env.SERVICE_B_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.SERVICE_B_IMAGE }}:latest

      # ---------- 9. Configure AWS credentials ----------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- 10. Update kubeconfig for EKS ----------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      # ---------- 11. Apply ConfigMap (idempotent) ----------
      - name: Apply ConfigMap
        run: |
          kubectl apply -f ${{ env.APP_ROOT }}/k8s/aws/micro-app/tax-service-config.yaml

      # ---------- 12. Set image in deployment manifests ----------
      - name: Render image tags into manifests
        run: |
          IMAGE_TAG=${{ steps.tag.outputs.tag }}
          # Service A
          sed -i "s|image: embarkx/tax-service-a.*|image: ${SERVICE_A_IMAGE}:${IMAGE_TAG}|" \
            ${{ env.APP_ROOT }}/k8s/aws/micro-app/service-a.yaml
          # Service B
          sed -i "s|image: embarkx/tax-service-b.*|image: ${SERVICE_B_IMAGE}:${IMAGE_TAG}|" \
            ${{ env.APP_ROOT }}/k8s/aws/micro-app/service-b.yaml

      # ---------- 13. Apply deployments & services ----------
      - name: Deploy service-a
        run: kubectl apply -f ${{ env.APP_ROOT }}/k8s/aws/micro-app/service-a.yaml

      - name: Deploy service-b
        run: kubectl apply -f ${{ env.APP_ROOT }}/k8s/aws/micro-app/service-b.yaml

      # ---------- 14. Apply ingress ----------
      - name: Apply ingress
        run: kubectl apply -f ${{ env.APP_ROOT }}/k8s/aws/micro-app/multi-service-ingress.yaml

      # ---------- 15. Wait for rollout ----------
      - name: Wait for service-a rollout
        run: kubectl rollout status deployment/service-a --timeout=120s

      - name: Wait for service-b rollout
        run: kubectl rollout status deployment/service-b --timeout=120s

      # ---------- 16. Smoke test ----------
      - name: Verify pods are running
        run: |
          kubectl get pods -l 'app in (service-a,service-b)' -o wide
          echo "✅ Deploy complete. Tag: ${{ steps.tag.outputs.tag }}"